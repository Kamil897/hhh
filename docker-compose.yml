version: '3.9'
services:
  mysql:
    image: mysql:8.4
    container_name: sdct-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: sdct
      MYSQL_USER: sdct
      MYSQL_PASSWORD: password
    ports:
      - '3306:3306'
    volumes:
      - sdct_mysql_data:/var/lib/mysql
    command: ["--default-authentication-plugin=mysql_native_password"]
volumes:
  sdct_mysql_data: